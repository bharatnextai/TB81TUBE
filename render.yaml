services:
  - type: web
    name: tb81tube-backend
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build -w @tb81tube/backend
    startCommand: npm run db:migrate:deploy -w @tb81tube/backend && npm run start -w @tb81tube/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: DEV_MOCK_YOUTUBE_AUTH
        value: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
